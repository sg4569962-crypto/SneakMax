<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/reg/reg.css">
</head>
<body>
    

<div class="block">

    <h1 class="title">Регистрация</h1>

    <div class="block-input">

        <input type="text" class="login" id="login" required>
        <label for="login">Введите логин</label>

    </div>

    <div class="block-input">

        <input type="password" class="pass" id="pass" required>
        <label for="pass">Введите пароль</label>

    </div>

    <div class="block-input">

        <input type="password" class="pass2" id="pass2" required>
        <label for="pass2">Повторите пароль</label>

    </div>

    <p class="error-text"></p>
    <button class="reg-btn">Зарегистрироваться</button>

</div>

<script src="/reg/reg.js"></script>
</body>
</html>
